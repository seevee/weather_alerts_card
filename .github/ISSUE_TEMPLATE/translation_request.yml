name: Translation Request
description: Ask for a new language, offer to write one, or correct an existing one
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        A translation is one file of a couple of hundred short strings. You can write it in GitHub's web editor, no checkout needed, and partial is fine: any string you skip falls back to English. [CONTRIBUTING.md](https://github.com/seevee/weather_alerts_card/blob/main/CONTRIBUTING.md#translations) has the steps.
  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - A language the card doesn't have yet
        - Corrections to a language it already has
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: Include the region if it matters, e.g. "Dutch" or "Portuguese (Brazil)".
    validations:
      required: true
  - type: input
    id: locale-code
    attributes:
      label: Home Assistant locale code
      description: e.g. nl, pt-BR, zh-Hans. Leave blank if you're not sure.
  - type: dropdown
    id: can-help
    attributes:
      label: Can you write or check the strings?
      description: A locale needs somebody who speaks the language, so this decides whether the request can go anywhere. Machine translation is a fine starting point.
      options:
        - Yes, I'll open a pull request
        - Yes, but I'd rather post the strings here
        - No, requesting only
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Strings that don't carry over cleanly, a regional variant you'd want covered, or whether you'd like to be tagged on future changes to this locale.
