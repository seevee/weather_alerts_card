name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ~40 s normally: every figure rendered headless. The apt step behind
    # --with-deps is the variable part and has taken 3 min on a slow mirror.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      # The figures are rendered from the real card in headless Chromium, so the
      # docs build needs a browser. A headless launch runs the headless shell,
      # so full Chrome is never fetched (--only-shell). --with-deps stays here,
      # unlike build.yml: the harness pages fall back to system fonts and the
      # apt set carries fonts, so dropping it could change the figures.
      # release.yml stays Playwright-free.
      - run: npx playwright install --with-deps --only-shell chromium

      # Builds dist/, renders every figure, and stages them in docs/public/img/.
      # DOCS_MOTION is deliberately unset: the motion capture is still being
      # tuned, and it would add an ffmpeg/ffprobe dependency to this runner.
      - run: npm run docs:media

      - run: npm run docs:build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
