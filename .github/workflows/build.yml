name: Build

on:
  push:
    branches: [main]
  pull_request:

# One run per PR (or per branch for pushes). A new push to a PR cancels the
# run it supersedes; pushes to main are never cancelled, so every merge commit
# keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A whole run is ~35 s; anything past this is a hung worker, not a slow one.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      # The browser test project drives headless Chromium through Playwright.
      # A headless launch runs the headless shell, so that is the only build
      # fetched (--only-shell), about 5 s. No --with-deps: the runner image
      # already has every library the shell links (it ships Chrome), and all
      # apt adds is fonts and mesa upgrades, 32 MB that took 3 min on a slow
      # mirror. No actions/cache either: a restore measured 3 s, so a hit
      # saved 2 s and a miss cost 4 s more for the save (#318).
      - run: npx playwright install --only-shell chromium

      - run: npm run lint
      - run: npm run test
      - run: npm run build
