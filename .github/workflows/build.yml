name: Build

on:
  push:
    branches: [main]
  pull_request:

# One run per PR (or per branch for pushes). A new push to a PR cancels the
# run it supersedes; pushes to main are never cancelled, so every merge commit
# keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A whole run is ~35 s; anything past this is a hung worker, not a slow one.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
