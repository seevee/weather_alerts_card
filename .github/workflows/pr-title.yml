name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# One run per PR (or per branch for pushes). A new push to a PR cancels the
# run it supersedes; pushes to main are never cancelled, so every merge commit
# keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title follows conventional commits
        env:
          # Pass the title through the environment, never inline it into the
          # script body — a title containing backticks or $(...) would otherwise
          # be shell-evaluated by ${{ }} template expansion (command injection).
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|perf|refactor|docs|chore|test|ci|build|style|revert)(\(.+\))?!?: .+'
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title must follow conventional commits format: type(scope): description"
            echo ""
            echo "Valid types: feat, fix, perf, refactor, docs, chore, test, ci, build, style, revert"
            echo "Examples:"
            echo "  feat: add Italian translations"
            echo "  feat(i18n): add Italian translations"
            echo "  fix: resolve dark mode rendering issue"
            exit 1
          fi
